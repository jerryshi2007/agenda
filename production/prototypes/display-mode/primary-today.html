<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>展示模式 - 小学今日视图</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    /* 页面特有样式 */
    .progress-bar {
      background: var(--color-bg-white);
      padding: 16px; /* → 32rpx */
      border-radius: var(--radius-md);
      margin-bottom: 16px; /* → 32rpx */
    }
    .progress-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px; /* → 16rpx */
    }
    .progress-text {
      font-size: 14px; /* → 28rpx */
      color: var(--color-text-primary);
    }
    .progress-percent {
      font-size: 18px; /* → 36rpx */
      font-weight: 600;
      color: var(--color-primary);
    }
    .progress-track {
      height: 12px; /* → 24rpx */
      background: var(--color-bg-page);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: 6px;
      transition: width var(--transition-base);
    }

    /* 日程列表 */
    .schedule-list {
      /* → <scroll-view scroll-y> */
    }
    .schedule-item {
      background: var(--color-bg-white);
      border-radius: var(--radius-md);
      padding: 16px; /* → 32rpx */
      margin-bottom: 12px; /* → 24rpx */
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .schedule-item:active {
      background: var(--color-bg-page);
    }
    .type-icon {
      width: 40px; /* → 80rpx */
      height: 40px; /* → 80rpx */
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px; /* → 40rpx */
      margin-right: 12px; /* → 24rpx */
      flex-shrink: 0;
    }
    .type-icon--activity {
      background: #E3F2FD;
    }
    .type-icon--routine {
      background: #E8F5E9;
    }
    .type-icon--homework {
      background: #FFF3E0;
    }
    .schedule-info {
      flex: 1;
      min-width: 0;
    }
    .schedule-name {
      font-size: 16px; /* → 32rpx */
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 4px; /* → 8rpx */
    }
    .schedule-time {
      font-size: 12px; /* → 24rpx */
      color: var(--color-text-secondary);
    }
    .check-btn {
      width: 32px; /* → 64rpx */
      height: 32px; /* → 64rpx */
      border-radius: var(--radius-round);
      border: 2px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px; /* → 36rpx */
      color: var(--color-text-white);
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }
    .check-btn--done {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    /* 标签栏（今日/周/月） */
    .tab-nav {
      display: flex;
      background: var(--color-bg-white);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 16px; /* → 32rpx */
    }
    .tab-nav-item {
      flex: 1;
      text-align: center;
      padding: 8px 0; /* → 16rpx 0 */
      border-radius: var(--radius-sm);
      font-size: 14px; /* → 28rpx */
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .tab-nav-item.active {
      background: var(--color-primary);
      color: var(--color-text-white);
      border-radius: var(--radius-sm);
    }

    /* 状态区块 */
    .state-block {
      display: none;
    }
    .state-block.active {
      display: block;
    }

    /* 底部安全区 */
    .safe-area-bottom {
      height: 20px; /* → 40rpx + env(safe-area-inset-bottom) */
    }
  </style>
</head>
<body>

<!-- 状态切换器（原型调试用） -->
<div class="state-switcher">
  <div class="state-switcher__label">切换状态</div>
  <button onclick="setState('normal')" class="active">正常态</button>
  <button onclick="setState('loading')">Loading</button>
  <button onclick="setState('empty')">空态</button>
  <button onclick="setState('error')">错误态</button>
</div>

<div class="phone-frame">
  <!-- 顶部：微信原生导航栏 -->
  <!-- title: "日程" -->
  <!-- backgroundColor: "#FFFFFF" -->
  <!-- frontColor: "#000000" -->
  <div class="status-bar"></div>
  <div class="nav-bar">
    <div class="nav-bar-title">日程</div>
  </div>

  <div class="page-body">
    <!-- ===== 正常态 ===== -->
    <div class="state-block state-normal active">
      <div class="prototype-note">
        <strong>小学模式（6-10岁）· 一期基准</strong><br>
        - 今日/周/月 三视图切换<br>
        - 按时间线排列，显示具体时间<br>
        - 点击打卡按钮直接打卡，支持撤销<br>
        - 顶部显示今日进度
      </div>

      <!-- 标签栏切换 -->
      <!-- → wx:for="{{tabs}}" bindtap="onTabChange" -->
      <div class="tab-nav">
        <div class="tab-nav-item active">今日</div>
        <div class="tab-nav-item">周</div>
        <div class="tab-nav-item">月</div>
      </div>
      <!-- → 此处映射：标签栏用 scroll-view 横向滚动，小学模式三标签足够无需滚动 -->

      <!-- 今日进度 -->
      <div class="progress-bar">
        <div class="progress-title">
          <span class="progress-text">今日进度</span>
          <span class="progress-percent">3/5</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: 60%"></div>
        </div>
      </div>

      <!-- 日程列表 -->
      <!-- → <scroll-view scroll-y enable-flex> -->
      <div class="schedule-list">
        <!-- → wx:for="{{todayList}}" -->
        <!-- data-id="primary-today-item-{{item.id}}" -->
        <div class="schedule-item" data-id="primary-today-item-1">
          <div class="type-icon type-icon--routine">🌅</div>
          <div class="schedule-info">
            <div class="schedule-name">起床</div>
            <div class="schedule-time">07:00 - 07:30</div>
          </div>
          <div class="check-btn check-btn--done">✓</div>
        </div>
        <div class="schedule-item" data-id="primary-today-item-2">
          <div class="type-icon type-icon--activity">🎒</div>
          <div class="schedule-info">
            <div class="schedule-name">上学</div>
            <div class="schedule-time">08:00 - 08:30</div>
          </div>
          <div class="check-btn check-btn--done">✓</div>
        </div>
        <div class="schedule-item" data-id="primary-today-item-3">
          <div class="type-icon type-icon--activity">🎨</div>
          <div class="schedule-info">
            <div class="schedule-name">美术课</div>
            <div class="schedule-time">10:00 - 11:00</div>
          </div>
          <div class="check-btn check-btn--done">✓</div>
        </div>
        <div class="schedule-item" data-id="primary-today-item-4">
          <div class="type-icon type-icon--activity">⚽</div>
          <div class="schedule-info">
            <div class="schedule-name">足球课</div>
            <div class="schedule-time">16:00 - 17:00</div>
          </div>
          <div class="check-btn"></div>
        </div>
        <div class="schedule-item" data-id="primary-today-item-5">
          <div class="type-icon type-icon--homework">📚</div>
          <div class="schedule-info">
            <div class="schedule-name">数学作业</div>
            <div class="schedule-time">19:00 - 19:40</div>
          </div>
          <div class="check-btn"></div>
        </div>
      </div>
      <!-- /scroll-view -->

      <div class="safe-area-bottom"></div>
    </div>

    <!-- ===== Loading态 ===== -->
    <div class="state-block state-loading">
      <!-- → wx:if="{{loading}}" -->
      <div class="loading-block">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
      </div>
      <div class="mt-md">
        <div class="skeleton skeleton--cell"></div>
        <div class="skeleton skeleton--cell mt-sm"></div>
        <div class="skeleton skeleton--cell mt-sm"></div>
        <div class="skeleton skeleton--cell mt-sm"></div>
        <div class="skeleton skeleton--cell mt-sm"></div>
      </div>
    </div>

    <!-- ===== 空态 ===== -->
    <div class="state-block state-empty">
      <!-- → wx:if="{{isEmpty}}" -->
      <div class="empty-state">
        <div class="empty-state__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <div class="empty-state__title">今天还没有日程</div>
        <div class="empty-state__desc">休息一天，好好享受吧～</div>
      </div>
    </div>

    <!-- ===== 错误态 ===== -->
    <div class="state-block state-error">
      <!-- → wx:if="{{error}}" -->
      <div class="error-state">
        <div class="error-state__icon">📶</div>
        <div class="error-state__title">加载失败</div>
        <div class="error-state__desc">网络异常，请检查网络连接</div>
        <button class="btn btn--primary mt-md" data-id="primary-retry-btn">重试</button>
      </div>
    </div>
  </div>

  <!-- 微信原生 TabBar -->
  <!-- tabBar.list: [{ text: "日程", pagePath: "pages/calendar/index" },
                    { text: "我的", pagePath: "pages/my/index" }] -->
  <div class="tab-bar">
    <div class="tab-bar-item active">
      <div class="tab-bar-icon">📅</div>
      <div class="tab-bar-label">日程</div>
    </div>
    <div class="tab-bar-item">
      <div class="tab-bar-icon">👤</div>
      <div class="tab-bar-label">我的</div>
    </div>
  </div>
</div>

<script>
function setState(state) {
  document.querySelectorAll('.state-block').forEach(el => {
    el.classList.remove('active');
  });
  document.querySelector('.state-' + state).classList.add('active');
  document.querySelectorAll('.state-switcher button').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
}
</script>
</body>
</html>
