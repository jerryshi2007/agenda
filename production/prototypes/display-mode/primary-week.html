<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>展示模式 - 小学周视图</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    /* 周视图特有样式 */
    .week-header {
      background: var(--color-bg-white);
      border-radius: var(--radius-md);
      padding: 16px; /* → 32rpx */
      margin-bottom: 16px; /* → 32rpx */
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .week-title {
      font-size: 16px; /* → 32rpx */
      font-weight: 500;
    }
    .week-nav-btn {
      width: 28px; /* → 56rpx */
      height: 28px; /* → 56rpx */
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      background: var(--color-bg-page);
      cursor: pointer;
    }
    .week-nav-btn:active {
      background: var(--color-border);
    }

    /* 星期头部 */
    .week-days-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px; /* → 8rpx */
      background: var(--color-bg-white);
      padding: 12px 8px; /* → 24rpx 16rpx */
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .day-name {
      text-align: center;
      font-size: 12px; /* → 24rpx */
      color: var(--color-text-secondary);
    }
    .day-name.today {
      color: var(--color-primary);
      font-weight: 500;
    }

    /* 日期格子 */
    .week-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px; /* → 8rpx */
      background: var(--color-bg-white);
      padding: 8px 8px 12px; /* → 16rpx 16rpx 24rpx */
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      margin-bottom: 16px; /* → 32rpx */
    }
    .day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      cursor: pointer;
      min-height: 40px; /* → 80rpx */
    }
    .day-cell.today {
      background: var(--color-primary-light);
    }
    .day-cell.other-month {
      opacity: 0.3;
    }
    .day-number {
      font-size: 14px; /* → 28rpx */
      font-weight: 500;
      margin-bottom: 2px; /* → 4rpx */
    }
    .day-cell.today .day-number {
      color: var(--color-primary);
    }
    /* 日程点 */
    .day-dots {
      display: flex;
      gap: 2px; /* → 4rpx */
    }
    .dot {
      width: 6px; /* → 12rpx */
      height: 6px; /* → 12rpx */
      border-radius: var(--radius-round);
    }
    .dot--activity {
      background: #2196F3; /* 课后活动蓝 */
    }
    .dot--routine {
      background: #4CAF50; /* 日常作息绿 */
    }
    .dot--homework {
      background: #FF9800; /* 作业任务橙 */
    }

    /* 今日日程简要列表 */
    .today-schedule {
      background: var(--color-bg-white);
      border-radius: var(--radius-md);
      padding: 16px; /* → 32rpx */
    }
    .today-schedule-title {
      font-size: 14px; /* → 28rpx */
      font-weight: 500;
      margin-bottom: 12px; /* → 24rpx */
    }
    .mini-schedule-item {
      display: flex;
      align-items: center;
      padding: 8px 0; /* → 16rpx 0 */
      border-bottom: 1px solid var(--color-border-light);
    }
    .mini-schedule-item:last-child {
      border-bottom: none;
    }
    .mini-type-icon {
      width: 24px; /* → 48rpx */
      height: 24px; /* → 48rpx */
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px; /* → 24rpx */
      margin-right: 8px; /* → 16rpx */
      flex-shrink: 0;
    }
    .mini-schedule-name {
      flex: 1;
      font-size: 14px; /* → 28rpx */
    }
    .mini-check-btn {
      width: 20px; /* → 40rpx */
      height: 20px; /* → 40rpx */
      border-radius: var(--radius-round);
      border: 2px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px; /* → 24rpx */
      color: var(--color-text-white);
    }
    .mini-check-btn--done {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    /* 标签栏 */
    .tab-nav {
      display: flex;
      background: var(--color-bg-white);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 16px; /* → 32rpx */
    }
    .tab-nav-item {
      flex: 1;
      text-align: center;
      padding: 8px 0; /* → 16rpx 0 */
      border-radius: var(--radius-sm);
      font-size: 14px; /* → 28rpx */
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .tab-nav-item.active {
      background: var(--color-primary);
      color: var(--color-text-white);
      border-radius: var(--radius-sm);
    }

    /* 状态区块 */
    .state-block {
      display: none;
    }
    .state-block.active {
      display: block;
    }

    /* 底部安全区 */
    .safe-area-bottom {
      height: 20px; /* → 40rpx + env(safe-area-inset-bottom) */
    }
  </style>
</head>
<body>

<!-- 状态切换器（原型调试用） -->
<div class="state-switcher">
  <div class="state-switcher__label">切换状态</div>
  <button onclick="setState('normal')" class="active">正常态</button>
  <button onclick="setState('loading')">Loading</button>
  <button onclick="setState('empty')">空态</button>
  <button onclick="setState('error')">错误态</button>
</div>

<div class="phone-frame">
  <!-- 顶部：微信原生导航栏 -->
  <!-- title: "日程" -->
  <div class="status-bar"></div>
  <div class="nav-bar">
    <div class="nav-bar-title">日程</div>
  </div>

  <div class="page-body">
    <!-- ===== 正常态 ===== -->
    <div class="state-block state-normal active">
      <div class="prototype-note">
        <strong>小学模式 · 周视图</strong><br>
        - 7天网格展示<br>
        - 色点区分日程类型<br>
        - 底部显示选中日期的简要日程列表<br>
        - 只读，点击日程跳转到今日视图对应位置
      </div>

      <!-- 标签栏切换 -->
      <div class="tab-nav">
        <div class="tab-nav-item">今日</div>
        <div class="tab-nav-item active">周</div>
        <div class="tab-nav-item">月</div>
      </div>

      <!-- 周导航 -->
      <div class="week-header">
        <div class="week-nav-btn">&lt;</div>
        <div class="week-title">2026年8月 第33周</div>
        <div class="week-nav-btn">&gt;</div>
      </div>

      <!-- 星期头部 -->
      <div class="week-days-header">
        <div class="day-name">日</div>
        <div class="day-name">一</div>
        <div class="day-name">二</div>
        <div class="day-name">三</div>
        <div class="day-name">四</div>
        <div class="day-name today">五</div>
        <div class="day-name">六</div>
      </div>

      <!-- 日期网格 -->
      <!-- → wx:for="{{weekDays}}" -->
      <div class="week-days-grid">
        <div class="day-cell other-month">
          <div class="day-number">27</div>
          <div class="day-dots"></div>
        </div>
        <div class="day-cell other-month">
          <div class="day-number">28</div>
          <div class="day-dots"></div>
        </div>
        <div class="day-cell other-month">
          <div class="day-number">29</div>
          <div class="day-dots">
            <span class="dot dot--routine"></span>
          </div>
        </div>
        <div class="day-cell other-month">
          <div class="day-number">30</div>
          <div class="day-dots">
            <span class="dot dot--routine"></span>
            <span class="dot dot--activity"></span>
          </div>
        </div>
        <div class="day-cell other-month">
          <div class="day-number">31</div>
          <div class="day-dots">
            <span class="dot dot--routine"></span>
            <span class="dot dot--activity"></span>
            <span class="dot dot--homework"></span>
          </div>
        </div>
        <div class="day-cell today">
          <div class="day-number">1</div>
          <div class="day-dots">
            <span class="dot dot--routine"></span>
            <span class="dot dot--activity"></span>
            <span class="dot dot--homework"></span>
          </div>
        </div>
        <div class="day-cell">
          <div class="day-number">2</div>
          <div class="day-dots">
            <span class="dot dot--routine"></span>
          </div>
        </div>
      </div>

      <!-- 今日简要日程 -->
      <div class="today-schedule">
        <div class="today-schedule-title">今日（8月1日）日程</div>
        <div class="mini-schedule-item">
          <div class="mini-type-icon type-icon--routine">🌅</div>
          <div class="mini-schedule-name">起床</div>
          <div class="mini-check-btn mini-check-btn--done">✓</div>
        </div>
        <div class="mini-schedule-item">
          <div class="mini-type-icon type-icon--activity">🎒</div>
          <div class="mini-schedule-name">上学</div>
          <div class="mini-check-btn mini-check-btn--done">✓</div>
        </div>
        <div class="mini-schedule-item">
          <div class="mini-type-icon type-icon--activity">🎨</div>
          <div class="mini-schedule-name">美术课</div>
          <div class="mini-check-btn mini-check-btn--done">✓</div>
        </div>
        <div class="mini-schedule-item">
          <div class="mini-type-icon type-icon--activity">⚽</div>
          <div class="mini-schedule-name">足球课</div>
          <div class="mini-check-btn"></div>
        </div>
        <div class="mini-schedule-item">
          <div class="mini-type-icon type-icon--homework">📚</div>
          <div class="mini-schedule-name">数学作业</div>
          <div class="mini-check-btn"></div>
        </div>
      </div>

      <div class="safe-area-bottom"></div>
    </div>

    <!-- ===== Loading态 ===== -->
    <div class="state-block state-loading">
      <div class="loading-block">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
      </div>
    </div>

    <!-- ===== 空态 ===== -->
    <div class="state-block state-empty">
      <div class="empty-state">
        <div class="empty-state__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <div class="empty-state__title">本周没有日程</div>
        <div class="empty-state__desc">等待家长安排新日程～</div>
      </div>
    </div>

    <!-- ===== 错误态 ===== -->
    <div class="state-block state-error">
      <div class="error-state">
        <div class="error-state__icon">📶</div>
        <div class="error-state__title">加载失败</div>
        <div class="error-state__desc">网络异常，请检查网络连接</div>
        <button class="btn btn--primary mt-md" data-id="primary-week-retry-btn">重试</button>
      </div>
    </div>
  </div>

  <!-- 微信原生 TabBar -->
  <div class="tab-bar">
    <div class="tab-bar-item active">
      <div class="tab-bar-icon">📅</div>
      <div class="tab-bar-label">日程</div>
    </div>
    <div class="tab-bar-item">
      <div class="tab-bar-icon">👤</div>
      <div class="tab-bar-label">我的</div>
    </div>
  </div>
</div>

<script>
function setState(state) {
  document.querySelectorAll('.state-block').forEach(el => {
    el.classList.remove('active');
  });
  document.querySelector('.state-' + state).classList.add('active');
  document.querySelectorAll('.state-switcher button').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
}
</script>
</body>
</html>
