user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP 80 强制跳转 HTTPS
    # server {
    #     listen 80;
    #     server_name  paiban.live;
    #     return 301 https://$host$request_uri;
    # }

    # HTTPS 443 代理
    server {
        listen 443 ssl;
        server_name  paiban.live;

        # 证书，宿主机 /opt/nginx/ssl 挂载到容器内 /etc/nginx/ssl
        ssl_certificate     /etc/nginx/ssl/paiban.live_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/paiban.live.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        # 头像静态资源：直接从宿主机挂载目录伺服（只读，与 API 共享 /opt/agenda/uploads）
        location /uploads/ {
            alias /opt/agenda/uploads/;
            expires 7d;
            access_log off;
        }

        # /api/* 请求转发到 agenda-api:8080
        # proxy_pass 不带 URI（无末尾斜杠），保留完整 /api/v1/... 路径回传后端
        location /api/ {
            proxy_pass http://agenda-api:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
        }
    }
}