# 注意：这是模板，真实密钥不要提交到 git。
# 复制为 secret.yaml 并填入真实值，或直接用下方 kubectl 命令创建（推荐）。
#
# kubectl -n agenda create secret generic agenda-api-secret \
#   --from-literal=JWT_SECRET_KEY='<openssl rand -base64 48>' \
#   --from-literal=WeChat__AppSecret='<你的 AppSecret>' \
#   --from-literal=ConnectionStrings__DefaultConnection='Host=<DB主机>;Port=5432;Database=agenda;Username=postgres;Password=<密码>'
apiVersion: v1
kind: Secret
metadata:
  name: agenda-api-secret
  namespace: agenda
type: Opaque
stringData:
  JWT_SECRET_KEY: "<REPLACE_ME>"
  WeChat__AppSecret: "<REPLACE_ME>"
  ConnectionStrings__DefaultConnection: "Host=<DB_HOST>;Port=5432;Database=agenda;Username=postgres;Password=<DB_PASSWORD>"
