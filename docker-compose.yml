services:
  # ---- PostgreSQL 16 ----
  postgres:
    image: postgres:16-alpine
    container_name: agenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agenda_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenda_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- .NET 10 Web API ----
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: agenda-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=agenda_dev;Username=postgres;Password=postgres
      Jwt__Key: AgendaDevKey-2026-ProductionSecret-MustBeAtLeast64BytesLong!!
      Jwt__Issuer: agenda-api
    ports:
      - "5000:8080"

volumes:
  pgdata: